  settings.claude_code:       { label: "Claude Code", role: Button }
  settings.claude_in_chrome:  { label: "Claude in Chrome", role: Button }
  settings.system:            { label: "System", role: Button }
  settings.extensions:        { label: "Extensions", role: Button }
