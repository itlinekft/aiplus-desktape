  # --- Settings dialog (open it from the account menu: see notes)
  settings.menu_item:         { label: "Settings", role: MenuItem }
  settings.search:            { label: "Search settings", role: Edit }
  settings.general:           { label: "General", role: Button }
  settings.account:           { label: "Account", role: Button }
  settings.privacy:           { label: "Privacy", role: Button }
  settings.billing:           { label: "Billing", role: Button }
  settings.usage:             { label: "Usage", role: Button }
  settings.capabilities:      { label: "Capabilities", role: Button }
  settings.memory:            { label: "Memory", role: Button }
  settings.design_systems:    { label: "Design systems", role: Button }
