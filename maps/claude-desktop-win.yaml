notes:
  - "Settings: Ctrl+, does not open them. Open the account menu (the sidebar button labelled with the account's name, just above Send feedback; it sits inside the hidden sidebar region, so find it with `look --all`) and pick @settings.menu_item. Settings is a Dialog; @dialog.close closes it."
  - "The account menu's items (Settings, Usage, Language, Get help, View changelog, Get API keys, Log out) render inside the hidden sidebar region too: `look --all --grep MenuItem` shows them."
  - "The app menu's top items (File, Edit, View, Go, Help) cannot be expanded through UI Automation (ExpandCollapse fails with 0x80040201). Do not drive them with arrow keys: Down moved focus into the sidebar's chat list and opened a chat."
  - "Equal labels resolve to the first match in tree order; add `nth: 2` or `nth: -1` (the last) in a step, e.g. the latest message's Copy. The Artifacts page's own Button \"New\" is the sidebar's twin, so it is not mapped."
  - "Cowork: the UI never says Cowork (only plugin descriptions do: \"Claude Desktop / Cowork\"). Its agentic session is Chat mode's new session, with @chat.project_or_folder and the Manual / Auto permission modes; @sidebar.new_task opens the scheduled-task dialog instead."
  - "An answer is finished when @message.read_aloud is present and @chat.stop is gone: `expect: \"@message.read_aloud\"`, then `absent: \"@chat.stop\"`, after @chat.send."
  - "An incognito chat (@chat.incognito) stays out of history and search; inside it the sidebar is hidden, so @sidebar.new is absent until @chat.exit_incognito."
  - "A Code session runs Claude Code on the target. Pick @code.permission.manual (asks before every change) or @code.permission.plan for tapes; a tool use then shows @permission.request with @permission.deny and @permission.always_allow. Wait for an answer with `expect: \"@code.finished\"` (or `absent: \"@code.stop\"`)."
  - "A Code session's messages are plain Text nodes (no \"You said:\" prefix), so ignore regions cannot hide them: they appear with `look --text` and in repair bundles, which stay local under runs/."
  - "A session's title is generated from the first prompt and is part of its header buttons (\"<title>, rename session\", \"More options for <title>\"), so they are not mapped: the sidebar's \"More options for …\" buttons come first in tree order and a prefix would hit them. Use the exact title in an ad hoc step."
  - "After Archive, Desktop opens the next session in the sidebar by itself; click @sidebar.new straight after."
  - "Chat mode and Code mode have different new-session screens: @chat.prompt vs @code.prompt."
  - "Plugins under Customize is a TabItem (action select), not a Button."
  - "The repository card's label carries its description too, so match it by prefix."
  - "A disabled button (Sync before a URL is chosen) is absent from the tree; expect it to appear instead."
  - "The URL field is a ComboBox: expand it, type, then pick the „Use …” option."
  - "Add marketplace accepts only github.com, gitlab.com, bitbucket.org, or a GitHub Enterprise / GitLab instance configured by the organization; any other host shows \"This host isn’t supported…\" and no Sync button (a placeholder host was accepted earlier on 2026-10-23 and rejected at 22:08; the cause was not measured)."
  - "Updating a plugin from a git marketplace is three steps: Manage marketplaces > Check for updates; Yours > the plugin's card > @plugins.update; then @plugins.update_anyway, because Desktop counts its own .in_use marker in the plugin cache as a local change."
  - "A plugin's version shows on its own page as a separate Text (\"0.1.0\"): `look --text --grep '^Text \"\\d+\\.\\d'`."
  - "Removing a marketplace asks to confirm with a Button \"Remove\" in a \"Remove marketplace?\" dialog, and uninstalls its plugins."
  - "Typing into the Electron window needs delivery_mode foreground; clicks by element work in the background."
  - "Do not press Dictate, Use voice mode or \"Press and hold to record\" in a tape: they open the microphone."
