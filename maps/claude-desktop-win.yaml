# Claude Desktop on Windows: named selectors for tapes (`click: "@plugins.add_plugin"`).
# Mapped 2026-10-23 with `look --new` on every main screen, menu and dialog; the first entries come from the
# spike tape (docs/spike-2026-10-23.md §4). Only fixed UI is named here: never a user's chats, projects,
# artifacts or account. Keep one-off selectors inline in a tape.
app: Claude Desktop
version: "3.6556.2.0 (Microsoft Store build)"
window: Claude

# Hidden from `look` and repair bundles (`look --all` shows them), named by fixed elements only.
ignore:
  # Sidebar: the user's pinned and recent chats, projects and sessions, and the account button
  - { from: { role: Text, label: "Pinned" }, until: { role: Group, label: "Primary pane" } }
  - { subtree: { role: Group, label: "Notifications" } }
  - { from: { role: Text, label: "Recent artifacts" } }        # the new-chat screen's artifact list
  - { from: { role: List, label: "Search or create a project" }, until: { role: ListItem, label: "New project" } }
  - { from: { role: List, label: "Command palette options" }, until: { role: Button, label: "Compose" } }  # search: recent sessions
  - { subtree: { role: List, label: "Artifacts" } }             # Artifacts and Design pages: the user's artifacts
  - { subtree: { role: List, label: "Projects" } }              # Projects page: the user's projects
  # An open chat's messages (their text is the label), so a look or a repair bundle never carries them:
  - { subtree: { role: Text, label: "You said:", prefix: true } }
  - { subtree: { role: Text, label: "Claude responded:", prefix: true } }
  - { subtree: { role: Button, label: "Show message actions for", prefix: true } }

elements:
  # --- mode switch (top of the sidebar). The Chat radio's label carries a status ("Claude, awaiting your
  # input"), so match it by prefix.
  mode.chat:                  { label: "Claude", role: RadioButton, prefix: true, action: select }
  mode.code:                  { label: "Code", role: RadioButton, action: select }

  # --- sidebar, fixed navigation
  sidebar.new:                { label: "New", role: Button }
  sidebar.search:             { label: "Search", role: Button }
  sidebar.projects:           { label: "Projects", role: Button, prefix: true }   # "Projects Beta" / "Projects New"
  sidebar.create_project:     { label: "Create project", role: Button, action: expand }
  sidebar.artifacts:          { label: "Artifacts", role: Button }
  sidebar.scheduled:          { label: "Scheduled", role: Button }        # Chat mode
  sidebar.design:             { label: "Design", role: Button }           # Chat mode
  sidebar.new_task:           { label: "New task", role: Button, action: expand }   # Chat mode
  sidebar.new_from_template:  { label: "New from a template", role: Button, action: expand }
  sidebar.customize:          { label: "Customize", role: Button }
  sidebar.more:               { label: "More navigation items", role: Button, action: expand }
  sidebar.hide:               { label: "Hide sidebar", role: Button }
  app.menu:                   { label: "Menu", role: Button }             # File, Edit, View, Go, Help

  # --- new chat (Chat mode)
  chat.prompt:                { label: "Write your prompt to Claude", role: Edit }
  chat.add:                   { label: "Add files, connectors, and more", role: Button, action: expand }
  chat.add.upload:            { label: "Upload or add files", role: MenuItem }
  chat.add.folder:            { label: "Add folder", role: MenuItem }
  chat.add.skills:            { label: "Skills", role: MenuItem, action: expand }
  chat.add.connectors:        { label: "Connectors", role: MenuItem, action: expand }
  chat.add.plugins:           { label: "Plugins", role: MenuItem, action: expand }
  chat.add.research:          { label: "Research", role: CheckBox, action: toggle }
  chat.project_or_folder:     { label: "Project or folder", role: Button, action: expand }
  chat.project_search:        { label: "Search or create a project", role: ComboBox }
  chat.permission_mode:       { label: "Auto", role: Button, action: expand }   # label is the current mode
  chat.permission.manual:     { label: "Manual", role: RadioButton, prefix: true, action: select }
  chat.permission.auto:       { label: "Auto", role: RadioButton, prefix: true, action: select }
  chat.incognito:             { label: "Use incognito", role: Button }
  chat.recent_artifacts:      { label: "Recent artifacts", role: Button }

  # --- model picker (both modes); its label carries the current model ("Model: Opus 5.5 Medium")
  model.picker:               { label: "Model:", role: Button, prefix: true }
  model.fable:                { label: "Fable", role: RadioButton, prefix: true, action: select }
  model.opus:                 { label: "Opus", role: RadioButton, prefix: true, action: select }
  model.sonnet:               { label: "Sonnet", role: RadioButton, prefix: true, action: select }
  model.haiku:                { label: "Haiku", role: RadioButton, prefix: true, action: select }
  model.effort:               { label: "Effort", role: MenuItem, prefix: true, action: expand }
  model.more:                 { label: "More models", role: MenuItem, action: expand }

  # --- new session (Code mode)
  code.prompt:                { label: "Prompt", role: Edit }
  code.add:                   { label: "Add", role: Button, action: expand }
  code.terminal:              { label: "Terminal", role: Button, action: toggle }
  code.browser:               { label: "Browser", role: Button, action: toggle }
  code.environment:           { label: "Environment:", role: Button, prefix: true, action: expand }
  code.folder:                { label: "Folder:", role: Button, prefix: true, action: expand }
  code.permissions:           { label: "Permissions:", role: Button, prefix: true, action: expand }
  usage.indicator:            { label: "Usage:", role: Button, prefix: true }

  # --- search dialog
  search.input:               { label: "Search", role: ComboBox }
  search.close:               { label: "Close", role: Button }
  search.tab.all:             { label: "All", role: TabItem, action: select }
  search.tab.artifacts:       { label: "Artifacts", role: TabItem, action: select }
  search.tab.sessions:        { label: "Sessions", role: TabItem, action: select }
  search.tab.code:            { label: "Code", role: TabItem, action: select }
  search.tab.projects:        { label: "Projects", role: TabItem, action: select }
  search.tab.scheduled:       { label: "Scheduled", role: TabItem, action: select }

  # --- Projects page
